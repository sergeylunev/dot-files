# tmux config - no plugins, no TPM, just this file. See docs/tmux.md for
# the workflow this is built around (kitty tab = project, tmux session =
# project, tmux windows = processes inside it - agent/shell/...).

# Default prefix (ctrl+b) and default bindings are left alone on purpose -
# no reason to relearn muscle memory for something that already works.
# The only additions below are extra bindings on top of the defaults,
# nothing is unbound or replaced.

# --- Pane navigation (vim-style, additive) --------------------------------
# Default arrow-key pane navigation (prefix + Up/Down/Left/Right) still
# works; these just add hjkl next to it.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Status bar ------------------------------------------------------------
# Just the built-in window list (which process/window am I in - highlighted
# automatically for the active one). No session name here - it's already
# shown in the kitty tab above (see set-titles-string below), so repeating
# it in status-left would just be noise. No clock/hostname either.
set -g status-left ""
set -g status-right ""

# Right under the kitty tab bar instead of at the bottom of the terminal -
# the tmux window list becomes a second, nested row of "tabs" directly
# below the kitty ones.
set -g status-position top

# --- Terminal title (kitty tab title) --------------------------------------
# tmux doesn't touch the outer terminal's title by default (set-titles is
# off), so kitty's tab just shows whatever the foreground process last set
# it to. Take that over: report the session name - the project's directory
# name, stable no matter which window/pane or subdirectory you're in -
# truncated to 20 characters so a long project name doesn't stretch the
# kitty tab.
set -g set-titles on
set -g set-titles-string "#{=/20/…:#{session_name}}"
