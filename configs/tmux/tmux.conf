# tmux config - no plugins, no TPM, just this file. See docs/tmux.md for
# the workflow this is built around (kitty tab = project, tmux session =
# project, tmux windows = processes inside it - agent/shell/...).

# Default prefix (ctrl+b) and default bindings are left alone on purpose -
# no reason to relearn muscle memory for something that already works.
# The only additions below are extra bindings on top of the defaults,
# nothing is unbound or replaced.

# --- Pane navigation (vim-style, additive) --------------------------------
# Default arrow-key pane navigation (prefix + Up/Down/Left/Right) still
# works; these just add hjkl next to it.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Status bar ------------------------------------------------------------
# Session name on the left (which project am I in), the built-in window
# list in the middle (which process/window am I in - highlighted
# automatically for the active one), nothing on the right - no
# clock/hostname clutter.
set -g status-left-length 40
set -g status-left "#[bold]#S#[default] "
set -g status-right ""
