# Keyboard layouts: us + ru, capslock as left Ctrl, alt+shift cycles.
# ctrl+shift+1 -> us, ctrl+shift+2 -> ru. Sourced from hyprland.conf by
# install/install_functions.sh (setup_keyboard_hyprland).
input {
    kb_layout = us,ru
    kb_options = ctrl:nocaps,grp:alt_shift_toggle
}

bind = CTRL SHIFT, 1, exec, hyprctl switchxkblayout all 0
bind = CTRL SHIFT, 2, exec, hyprctl switchxkblayout all 1
