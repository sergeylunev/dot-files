# Ash (Greige) color scheme for kitty.
#
# Ash is a light, monochrome theme with a single red accent. Source of
# truth: ~/Projects/AshTheme (generate.py, Zed, OpenCode). This is the
# Greige variant - the default one, and the one used by the other configs
# in this repo.
#
# The ANSI palette is a smooth grey ramp with a single red slot (color1 /
# bright color9). Green/yellow/blue/magenta/cyan are all neutral greys on
# purpose - that's what makes the theme read as monochrome.

foreground              #2a2724
background              #f4f2ed

cursor                  #2a2724
cursor_text_color       #f4f2ed

selection_foreground    #2a2724
selection_background    #d6d2ca

url_color               #ba3226

# black
color0  #2a2724
color8  #1e1c1a

# red (the only accent)
color1  #ba3226
color9  #ce4538

# green
color2  #44403c
color10 #363430

# yellow
color3  #524f4c
color11 #46433e

# blue
color4  #686560
color12 #575450

# magenta
color5  #8a8680
color13 #928e88

# cyan
color6  #a8a49b
color14 #c6c1b8

# white
color7  #f4f2ed
color15 #f8f6f2
