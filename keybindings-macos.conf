# macOS keyboard shortcuts, ported from iTerm2/macOS muscle memory.
# Included from kitty.conf via `include keybindings-${KITTY_OS}.conf`.
# Linux equivalents (where one is needed) are in keybindings-linux.conf.
# See docs/kitty-keybindings.md for the full picture, including which of
# these already duplicate a kitty default.

#: Clipboard
map cmd+c       copy_to_clipboard
map cmd+v       paste_from_clipboard

#: Scrolling
map cmd+up      scroll_line_up
map cmd+down    scroll_line_down

#: Window management
map cmd+enter       new_window
map cmd+n           new_os_window
map shift+cmd+d     close_window

#: Tab management
map cmd+t       new_tab
map cmd+w       close_tab
map shift+cmd+w close_os_window
map shift+cmd+i set_tab_title

# Selecting numbered tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5

map cmd+p goto_tab -1

#: Miscellaneous
map ctrl+cmd+f  toggle_fullscreen
map cmd+,       edit_config_file
map cmd+ctrl+l  clear_terminal to_cursor_scroll active
map ctrl+cmd+,  load_config_file
map cmd+m       minimize_macos_window
map cmd+q       quit
