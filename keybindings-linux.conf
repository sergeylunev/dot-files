# Linux equivalents of a few macOS-only shortcuts from keybindings-macos.conf.
# Included from kitty.conf via `include keybindings-${KITTY_OS}.conf`.
#
# Most of keybindings-macos.conf isn't ported here because it's already
# covered by kitty's own kitty_mod (ctrl+shift) defaults on every OS - see
# docs/kitty-keybindings.md for the full breakdown of what's redundant.
#
# `ctrl+alt+<letter>` is used instead of `ctrl+shift+<letter>` (kitty_mod)
# where kitty_mod+<letter> is already taken by a different default action -
# see docs/kitty-keybindings.md for exactly which one each collides with.
# Plain `ctrl+<digit>` is safe as-is: it isn't a shell/readline control
# character and doesn't collide with any kitty_mod default.

# Selecting numbered tab - no default kitty_mod+<digit> equivalent
# (kitty_mod+1..5 focus windows 1-5, not tabs)
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5

# Close OS window - kitty_mod+w is already "close window" (not OS window)
map ctrl+alt+w close_os_window

# Quit kitty - kitty_mod+q is already "close tab", and there is no other
# cross-platform default for quitting
map ctrl+alt+q quit
